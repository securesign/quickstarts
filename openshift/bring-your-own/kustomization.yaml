apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rhtas-byo

resources:
  - namespace.yaml
  - securesign.yaml
  - ../shared/cosign

labels:
  - includeSelectors: true
    pairs:
      environment: byo

secretGenerator:
  - name: mariadb
    behavior: create
    options:
      disableNameSuffixHash: true
    literals:
      - mysql-database=trillian
      - mysql-host=mariadb.rhtas-mariadb.svc.cluster.local
      - mysql-password=userpassword
      - mysql-port=3306
      - mysql-root-password=your-root-password
      - mysql-user=dbuser
  - name: fulcio-signer
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - key=target/fulcio.key
  - name: fulcio-public
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - cert=target/fulcio.crt
  - name: rekor-signer
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - key=target/rekor.key
  - name: ctlog-signer
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - key=target/ctlog.key
      - public=target/ctlog.pub
  - name: tsa-signer
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - key=target/tsa.key
  - name: tsa-public
    behavior: create
    options:
      disableNameSuffixHash: true
    files:
      - chain=target/tsa-chain.pem
