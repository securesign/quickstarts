kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: ctlog
  namespace: rhtas-gateway-api
  labels:
    ingresscontroller: rhtas-com
spec:
  path: /
  to:
    kind: Service
    name: ctlog-gateway-istio
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
