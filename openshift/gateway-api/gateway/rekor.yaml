apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rekor-gateway
  namespace: rhtas-gateway-api
  labels:
    kuadrant.io/gateway: "true"
spec:
  infrastructure:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: rekor-gateway-tls
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: rekor-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rekor
  namespace: rhtas-gateway-api
spec:
  parentRefs:
    - name: rekor-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: rekor-server
          port: 80
