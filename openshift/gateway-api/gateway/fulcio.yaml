apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fulcio-gateway
  namespace: rhtas-gateway-api
  labels:
    kuadrant.io/gateway: "true"
spec:
  infrastructure:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: fulcio-gateway-tls
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: fulcio-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fulcio
  namespace: rhtas-gateway-api
spec:
  parentRefs:
    - name: fulcio-gateway
  rules:
    - matches:
      - method: GET
        path:
          type: Exact
          value: /api/v1/rootCert
      - path:
          type: PathPrefix
          value: /api/v2
      backendRefs:
        - name: fulcio-server
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/v1/signingCert
          method: POST
      backendRefs:
        - name: fulcio-server
          port: 80
